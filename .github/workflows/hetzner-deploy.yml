name: Hobbytischlerei zu Hetzner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hobbytischlerei-hetzner
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Website prüfen
        run: python3 scripts/validate.py
      - name: SFTP installieren
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Website zu Hetzner übertragen
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_PATH: ${{ secrets.HETZNER_PATH }}
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HETZNER_HOST HETZNER_USER SSHPASS; do
            if [ -z "${!name}" ]; then echo "Fehlendes Secret: $name"; exit 1; fi
          done
          HETZNER_PORT="${HETZNER_PORT:-22}"
          export HETZNER_PORT
          batch=$(mktemp)
          python3 - "$batch" <<'PYTHON'
          import os,sys
          from pathlib import Path
          def quote(s):
              return '"'+str(s).replace('\\','\\\\').replace('"','\\"')+'"'
          root=Path('dist')
          commands=['cd '+quote(os.environ.get('HETZNER_PATH') or '/')]
          commands += ['-mkdir '+quote(p.relative_to(root)) for p in sorted(root.rglob('*')) if p.is_dir()]
          commands += ['put '+quote(p)+' '+quote(p.relative_to(root)) for p in sorted(root.rglob('*')) if p.is_file()]
          Path(sys.argv[1]).write_text('\n'.join(commands+['bye'])+'\n')
          PYTHON
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new -oConnectTimeout=20 -P "$HETZNER_PORT" -b "$batch" "$HETZNER_USER@$HETZNER_HOST"
          rm -f "$batch"
